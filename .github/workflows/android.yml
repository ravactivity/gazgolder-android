name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Permanent debug key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.jks"
            echo "ANDROID_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set: the debug APK is signed with a random key and cannot update a previous install"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Remove the debug key
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: gazgolder-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
