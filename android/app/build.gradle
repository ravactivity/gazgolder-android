apply plugin: 'com.android.application'

android {
    namespace = "io.rav.gazgolder"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.rav.gazgolder"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv("VERSION_CODE") ?: "1") as Integer)
        versionName(System.getenv("VERSION_NAME") ?: "0.1.0-rc")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def ksProps = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
    def ks = { String k, String env -> System.getenv(env) ?: ksProps.getProperty(k) }
    signingConfigs {
        debug {
            def dk = ks("debugStoreFile", "ANDROID_DEBUG_KEYSTORE_FILE")
            if (dk && file(dk).exists()) {
                storeFile file(dk)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (ks("storeFile", "ANDROID_KEYSTORE_FILE")) {
                storeFile file(ks("storeFile", "ANDROID_KEYSTORE_FILE"))
                storePassword ks("storePassword", "ANDROID_KEYSTORE_PASSWORD")
                keyAlias ks("keyAlias", "ANDROID_KEY_ALIAS")
                keyPassword ks("keyPassword", "ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ks("storeFile", "ANDROID_KEYSTORE_FILE")) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation "com.google.android.gms:play-services-auth:22.0.0"
    implementation "androidx.camera:camera-core:1.6.2"
    implementation "androidx.camera:camera-camera2:1.6.2"
    implementation "androidx.camera:camera-lifecycle:1.6.2"
    implementation "androidx.camera:camera-view:1.6.2"
    implementation "androidx.work:work-runtime:2.11.2"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
